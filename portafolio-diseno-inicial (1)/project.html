<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Proyecto — Portafolio</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    .detail { max-width: 1200px; margin: 0 auto; padding: 70px 7vw 100px; }
    .detail h1 { font-size: clamp(2.8rem, 7vw, 6rem); letter-spacing: -.06em; line-height: 1; font-weight: 500; margin: 24px 0; }
    .detail .lead { font-size: 1.1rem; color: var(--muted); max-width: 700px; }
    .detail-cover { width: 100%; max-height: 780px; object-fit: contain; background: #eee9e0; margin: 36px 0; }
    .detail-copy { max-width: 740px; white-space: pre-line; }
    .detail-gallery { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 35px; }
    .detail-gallery img { width: 100%; height: auto; display: block; }
    @media(max-width:650px){.detail{padding:45px 6vw 70px}.detail-gallery{grid-template-columns:1fr}}
  </style>
</head>
<body>
<header class="site-header">
  <a class="wordmark" href="/">PORTAFOLIO<span>®</span></a>
  <nav aria-label="Navegación principal"><a href="/#proyectos">Proyectos</a><a href="/#sobre-mi">Sobre mí</a><a href="/#contacto">Contacto</a></nav>
  <a class="header-note" href="/#proyectos">← Volver</a>
</header>
<main id="detail" class="detail"><p class="eyebrow">PROYECTO</p><h1>Cargando…</h1></main>
<script>
(async function(){
 const root=document.querySelector("#detail");
 const slug=new URLSearchParams(location.search).get("slug");
 try {
  const r=await fetch("/projects/projects.json"); const data=await r.json(); const items=data.projects||[];
  const p=items.find(x=>x.slug===slug && x.published!==false);
  if(!p) throw new Error("No se encontró el proyecto.");
  document.title=p.title+" — Portafolio";
  const safe=s=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  root.innerHTML=`<p class="eyebrow">${safe(p.category||"DISEÑO")}</p><h1>${safe(p.title)}</h1><p class="lead">${safe(p.description)}</p>${p.cover?`<img class="detail-cover" src="/${safe(p.cover).replace(/^\\/+/,"")}" alt="${safe(p.cover_alt||p.title)}">`:""}<div class="detail-copy">${safe(p.body||"")}</div>${(p.gallery||[]).map(src=>`<img class="detail-cover" loading="lazy" src="/${safe(src).replace(/^\\/+/,"")}" alt="${safe(p.title)}">`).join("")}`;
 } catch(e){root.innerHTML="<p class='eyebrow'>PROYECTO</p><h1>Este proyecto no está disponible.</h1><a class='text-link' href='/#proyectos'>Volver a proyectos ↗</a>";}
})();
</script>
</body>
</html>
